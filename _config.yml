title:              udienz blog
email:              udienz@gmail.com
description:        A personal blog, talk about life, and other stuff
author:             Mahyuddin Susanto
baseurl:            "/"
url:                "https://www.udienz.web.id"

# Social Profiles
twitter_username:   udienz
github_username:    udienz
facebook_username:  udienz.net
instagram_username:  udienz
linkedin_username: udienz

# Add your google-analytics ID here to activate google analytics
google_analytics:   # GA4 measurement ID, e.g. G-XXXXXXXXXX (the old UA- ID no longer collects data)

# Build settings
markdown:           kramdown
kramdown:
  toc_levels:       2..3
sass:
  style:            compressed
paginate:           5
paginate_path:      "/posts/page:num/"
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-gist
  - jekyll-sitemap ## Uncomment this line to silently generate a sitemaps.org compliant sitemap for your Jekyll site
  - jekyll-archives

# Halaman /tag/<nama>/ per tag. Tidak ada di daftar plugin GitHub Pages,
# jadi hanya dibangun di Cloudflare Pages (Jekyll 4).
jekyll-archives:
  enabled:
    - tags

# Feed hanya memuat kutipan, sampai penanda <!--more--> di tiap post.
excerpt_separator: "<!--more-->"
feed:
  excerpt_only: true

permalink: /:year/:month/:day/:title
exclude:
  - README.md

# Home page and author card of the editorial design (docs and decisions: issue #62).
# Topics are real categories: `name` must match a category written in the posts' `categories`.
# The counts come from the content, never from here. The hero photo is the owner's own (generated with OpenAI).
author_aka:         udienz
author_avatar:      "https://avatars.githubusercontent.com/u/30291?v=4"
author_bio:         "Linux and network enthusiast, open-source contributor, and a bit of a football addict."
home:
  hero_eyebrow:     "Personal notes & field logs"
  hero_title:       "Ideas, systems, and everything in between."
  hero_text:        "Catatan tentang Linux, networking, open source, sepak bola, dan hal-hal yang menarik perhatian."
  hero_image:       "/img/hero-workspace.webp"      # 1600 px wide
  hero_image_sm:    "/img/hero-workspace-sm.webp"   # 800 px wide, for phones
  hero_image_alt:   "A desk with Debian and Linux books, a Tux figure, a laptop showing neofetch, a Debian mug and headphones"
  topics:
    - name: "Linux"
      icon: "fa-brands fa-linux"
    - name: "Networking"
      icon: "fa-solid fa-network-wired"
    - name: "Sepak Bola"
      icon: "fa-solid fa-futbol"
    - name: "Game"
      icon: "fa-solid fa-gamepad"
