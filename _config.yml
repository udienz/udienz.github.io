title:              udienz blog
email:              udienz@gmail.com
description:        A personal blog, talk about life, and other stuff
author:             Mahyuddin Susanto
baseurl:            "/"
url:                "https://www.udienz.web.id"

# Social Profiles
twitter_username:   udienz
github_username:    udienz
facebook_username:  udienz.net
instagram_username:  udienz
linkedin_username: udienz

# Add your google-analytics ID here to activate google analytics
google_analytics:   # GA4 measurement ID, e.g. G-XXXXXXXXXX (the old UA- ID no longer collects data)

# Build settings
markdown:           kramdown
kramdown:
  toc_levels:       2..3
sass:
  style:            compressed
paginate:           5
paginate_path:      "/posts/page:num/"
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-gist
  - jekyll-sitemap ## Uncomment this line to silently generate a sitemaps.org compliant sitemap for your Jekyll site
  - jekyll-archives

# Halaman /tag/<nama>/ per tag. Tidak ada di daftar plugin GitHub Pages,
# jadi hanya dibangun di Cloudflare Pages (Jekyll 4).
jekyll-archives:
  enabled:
    - tags

# Feed hanya memuat kutipan, sampai penanda <!--more--> di tiap post.
excerpt_separator: "<!--more-->"
feed:
  excerpt_only: true

permalink: /:year/:month/:day/:title
exclude:
  - README.md
