---
layout: default
---
{% comment %}One tag page (jekyll-archives): the posts that carry a tag.{% endcomment %}
<div class="wrap page">
  <header class="page-head">
    <h1>#{{ page.title }}</h1>
    <p>{{ page.posts.size }} post dengan tag ini</p>
  </header>
  <div class="page-body">
    <ul class="archive-list">
      {% for post in page.posts %}
      <li>
        <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%Y-%m-%d" }}</time>
        <a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a>
      </li>
      {% endfor %}
    </ul>
  </div>
</div>
