---
layout: default
---

<!-- Page Header -->
<header class="masthead" style="background-image: url('{{ '/img/bg-index.jpg' | relative_url }}')">
    <div class="overlay"></div>
    <div class="container">
      <div class="row">
        <div class="col mx-auto">
          <div class="page-heading">
            <h1 class="text-break">#{{ page.title }}</h1>
            <span class="subheading">{{ page.posts.size }} post dengan tag ini</span>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="row">
      <div class="col mx-auto">

        <ul class="list-group list-group-flush mb-5">
          {% for post in page.posts %}
          <li class="list-group-item d-flex justify-content-between align-items-start px-0">
            <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
            <time datetime="{{ post.date | date_to_xmlschema }}" class="text-muted small text-nowrap ml-3">{{ post.date | date: "%Y-%m-%d" }}</time>
          </li>
          {% endfor %}
        </ul>

      </div>
    </div>
  </div>
