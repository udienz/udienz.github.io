---
layout: default
---

<!-- Page Header -->
{% assign hero = page.background | default: '/img/bg-index.jpg' %}
<header class="masthead" style="background-image: url('{{ hero | relative_url }}')">
    <div class="overlay"></div>
    <div class="container">
      <div class="row">
        <div class="col mx-auto">
          <div class="page-heading">
            <h1>{{ page.title }}</h1>
            {% if page.description %}
            <span class="subheading">{{ page.description }}</span>
            {% endif %}
          </div>
        </div>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="row">
      <div class="col mx-auto">

        {{ content }}

      </div>
     
    </div>
  </div>
