{% assign ga = site.google_analytics %}
{% if ga and ga contains "G-" and jekyll.environment == "production" %}
<!-- Google Analytics 4 -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ ga }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ ga }}');
</script>
{% endif %}
