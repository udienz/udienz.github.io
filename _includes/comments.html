<div id="disqus_thread"></div>
<script>
    /**
     *  RECOMMENDED CONFIGURATION VARIABLES: EDIT AND UNCOMMENT THE SECTION BELOW TO INSERT DYNAMIC VALUES FROM YOUR PLATFORM OR CMS.
     *  LEARN WHY DEFINING THESE VARIABLES IS IMPORTANT: https://disqus.com/admin/universalcode/#configuration-variables
     */
        var disqus_config = function () {
            this.page.url = "{{ page.url | absolute_url }}";  // Replace PAGE_URL with your page's canonical URL variable
            // Identifier keeps the old ".html" form so existing threads stay attached after the permalink change
            this.page.identifier = "{{ page.url }}{% unless page.url contains '.html' %}.html{% endunless %}"; // Replace PAGE_IDENTIFIER with your page's unique identifier variable
        };
    function loadDisqus() {
        var d = document, s = d.createElement('script');
        
        s.src = 'https://blogudienzwebid.disqus.com/embed.js';
        
        s.setAttribute('data-timestamp', +new Date());
        (d.head || d.body).appendChild(s);
    }
    // Load comments only when the reader nears them, keeping first paint fast
    var dq = document.getElementById('disqus_thread');
    if ('IntersectionObserver' in window) {
        new IntersectionObserver(function (e, o) { if (e[0].isIntersecting) { o.disconnect(); loadDisqus(); } }, {rootMargin: '400px'}).observe(dq);
    } else { loadDisqus(); }
</script>
